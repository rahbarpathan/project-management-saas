name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, Build & E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprintflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sprintflow_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sprintflow_test?schema=public
      CLIENT_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-jwt-access-secret-minimum-32-characters-for-testing!
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-minimum-32-characters-for-testing!
      VITE_API_URL: http://localhost:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code style (Lint)
        run: pnpm lint

      - name: Strict typecheck across workspaces
        run: pnpm typecheck

      - name: Generate Prisma Client
        run: pnpm --filter @sprintflow/api db:generate

      - name: Run Prisma Database Migrations
        run: pnpm --filter @sprintflow/api db:migrate

      - name: Run Backend Unit & Integration Tests (Vitest)
        run: pnpm test

      - name: Run Frontend Component Tests (Vitest)
        run: pnpm --filter @sprintflow/web test

      - name: Validate Production Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright End-to-End Suite
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
